name: Assembly boot qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: boot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boot:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch verified host tools
        run: ./tools/Get-Toolchain.ps1 -IncludeQemu
      - name: Assemble and validate media
        run: ./tools/Build.ps1
      - name: Check reproducibility and relative tool paths
        run: ./tests/Test-Reproducibility.ps1
      - name: Boot ISO under UEFI
        run: ./tools/Test-Qemu.ps1
      - name: Boot raw FAT under UEFI
        run: ./tools/Test-Qemu.ps1 -BootMedia Fat
      - name: Boot without audio hardware
        run: ./tools/Test-Qemu.ps1 -NoAudio
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Render Piper announcement on the host
        run: |
          python -m pip install piper-tts==1.8.0 onnxruntime==1.31.0
          python tools/Render-Piper.py
      - name: Build and reproduce Piper test ISO
        run: ./tests/Test-Reproducibility.ps1 -PiperPcmPath out/piper/joshua-announcement.pcm
      - name: Verify embedded Piper bytes against preview
        run: python tests/Test-Piper.py
      - name: Boot Piper ISO, FAT and no-audio paths
        run: |
          ./tools/Test-Qemu.ps1
          ./tools/Test-Qemu.ps1 -BootMedia Fat
          ./tools/Test-Qemu.ps1 -NoAudio
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joshua-boot-diagnostics
          path: |
            out/*.iso
            out/*.EFI
            out/*.json
            out/*.log
            out/*.png
            out/*.wav
            out/piper/*.wav
            out/piper/*.json
            out/piper/*.md
