name: Assembly boot qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: boot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boot:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch verified host tools
        run: ./tools/Get-Toolchain.ps1 -IncludeQemu
      - name: Assemble and validate media
        run: ./tools/Build.ps1
      - name: Check reproducibility and relative tool paths
        run: ./tests/Test-Reproducibility.ps1
      - name: Validate QEMU stack permission walker
        run: ./tests/Test-QemuStackWalk.ps1
      - name: Boot ISO under UEFI
        run: ./tools/Test-Qemu.ps1
      - name: Boot raw FAT under UEFI
        run: ./tools/Test-Qemu.ps1 -BootMedia Fat
      - name: Validate exception frame diagnostics
        run: ./tests/Test-FaultDiagnostics.ps1
      - name: Validate x2APIC delivery and missing-EOI rejection
        run: ./tests/Test-ApicTimer.ps1
      - name: Validate context launch, rejection and worker guard
        run: ./tests/Test-ContextSwitch.ps1
      - name: Validate bounded CPL3 exits, faults and watchdog
        run: ./tests/Test-UserRuntime.ps1
      - name: Reject malformed embedded ELF before private allocation
        run: ./tests/Test-ElfRuntime.ps1
      - name: Reject corrupted private paging snapshots
        run: python ./tests/test_user_paging_mutations.py out/user-none
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joshua-boot-diagnostics
          path: |
            out/*.iso
            out/*.EFI
            out/*.json
            out/*.log
            out/*.png
            out/keyboard-*/*.log
            out/keyboard-*/*.bin
            out/keyboard-*/*.json
            out/elf-*/*.log
            out/elf-*/*.json
            out/fault-*/*.log
            out/fault-*/*.json
            out/user-*/*.json
            out/user-*/*.log
            out/user-*/*.png
  memory-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build verified native NASM 2.16.03
        shell: bash
        run: |
          mkdir -p .tools
          curl --fail --location --retry 2 https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.xz --output .tools/nasm.tar.xz
          echo '1412a1c760bbd05db026b6c0d1657affd6631cd0a63cddb6f73cc6d4aa616148  .tools/nasm.tar.xz' | sha256sum --check
          tar -xJf .tools/nasm.tar.xz -C .tools
          cd .tools/nasm-2.16.03
          ./configure
          make -j2
          ln -s nasm nasm.exe
      - name: Exercise shared Assembly map validator
        shell: pwsh
        run: ./tests/Test-MemoryMap.ps1
      - name: Exercise candidate reservations against host oracle
        shell: pwsh
        run: ./tests/Test-Reservations.ps1
      - name: Exercise paging inventory and exclusion fixtures
        shell: pwsh
        run: ./tests/Test-PagingInventory.ps1
      - name: Exercise frame ownership and allocation oracle
        shell: pwsh
        run: ./tests/Test-Frames.ps1
      - name: Exercise owned mapping and inherited-cache fixtures
        shell: pwsh
        run: ./tests/Test-OwnedMap.ps1
      - name: Exercise active mapping lifecycle and invalidation ordering
        shell: pwsh
        run: ./tests/Test-Lifecycle.ps1
      - name: Decode descriptor/TSS/IST and guard policy fixtures
        shell: pwsh
        run: ./tests/Test-Descriptors.ps1
      - name: Validate ACPI roots, bounded reads and BSP topology
        shell: pwsh
        run: ./tests/Test-Acpi.ps1
      - name: Validate effective UC cache classification
        shell: pwsh
        run: ./tests/Test-CacheType.ps1
      - name: Validate controller authority and APIC route policy
        shell: pwsh
        run: ./tests/Test-ApicPolicy.ps1
      - name: Validate guarded kernel context frames and scheduling policy
        shell: pwsh
        run: ./tests/Test-KernelContext.ps1
      - name: Validate user descriptor authority and retirement
        shell: pwsh
        run: ./tests/Test-UserDescriptors.ps1
      - name: Validate private user storage, roots and ownership
        shell: pwsh
        run: ./tests/Test-UserStorage.ps1
      - name: Validate returning and discarded user frames
        shell: pwsh
        run: ./tests/Test-UserFrame.ps1
      - name: Validate bounded ELF plans and failure-atomic copies
        shell: pwsh
        run: ./tests/Test-Elf.ps1
      - name: Validate set1 keyboard decoding and bounded events
        shell: pwsh
        run: ./tests/Test-Keyboard.ps1
      - name: Validate ACPI keyboard and ISA route authority
        shell: pwsh
        run: ./tests/Test-KeyboardAuthority.ps1
      - name: Validate bounded keyboard command/reply policy
        shell: pwsh
        run: ./tests/Test-KeyboardController.ps1
      - name: Validate exact keyboard IRQ return frames
        shell: pwsh
        run: ./tests/Test-KeyboardFrame.ps1
      - name: Validate bounded console editor
        shell: pwsh
        run: ./tests/Test-ConsoleEditor.ps1
      - name: Validate checked console framebuffer grid
        shell: pwsh
        run: ./tests/Test-ConsoleGrid.ps1
  keyboard:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch verified host tools
        run: ./tools/Get-Toolchain.ps1 -IncludeQemu
      - name: Validate actual keyboard input, retirement and exact rejections
        run: ./tests/Test-KeyboardCampaign.ps1 -IncludeX2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joshua-keyboard-diagnostics
          path: |
            out/keyboard-*/*.log
            out/keyboard-*/*.bin
            out/keyboard-*/*.json
